apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api
type: Opaque
stringData:
  HIVE_API_TOKEN: {{ required "apiToken is required: scripts/hive_api_server.py rejects unauthenticated data-endpoint calls only when HIVE_API_TOKEN is set; pass --set apiToken=..." .Values.apiToken | quote }}
