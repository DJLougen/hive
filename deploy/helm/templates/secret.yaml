apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api
type: Opaque
stringData:
  {{- if has (lower .Values.apiToken) (list "replace-me" "changeme" "change-me" "todo" "placeholder" "your-token-here" "secret" "password" "test" "dev" "none" "null") }}
  {{- fail "apiToken is a placeholder value: the server runs with HIVE_PRODUCTION=true and refuses to start on it — pass a real token, e.g. --set apiToken=$(openssl rand -hex 32)" }}
  {{- end }}
  HIVE_API_TOKEN: {{ required "apiToken is required: scripts/hive_api_server.py rejects unauthenticated data-endpoint calls only when HIVE_API_TOKEN is set; pass --set apiToken=..." .Values.apiToken | quote }}
