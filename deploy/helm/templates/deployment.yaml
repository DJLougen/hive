apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount > 1 is not supported: Hive memory is per-pod local state and replicas would diverge — see deploy/README.md" }}
  {{- end }}
  replicas: {{ .Values.replicaCount }}
  # Recreate: two overlapping pods would serve divergent local memory and
  # race on the same snapshot file. Never run old+new simultaneously.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: hive
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # scripts/hive_api_server.py serves /health, /ready, /route,
          # /compress, /remember, /recall on this port.
          command: ["python3", "scripts/hive_api_server.py"]
          args: ["--host", "0.0.0.0", "--port", "{{ .Values.service.port }}"]
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: HIVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api
                  key: HIVE_API_TOKEN
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
            {{- range $key, $val := .Values.serverEnv }}
            - name: {{ $key }}
              value: "{{ $val }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
