# Bearer token for the Hive API server (scripts/hive_api_server.py).
# When HIVE_API_TOKEN is set, /route, /compress, /remember and /recall
# require `Authorization: Bearer <token>`; /health and /ready stay public.
#
# Prefer creating this out-of-band instead of committing a value (the
# --dry-run | apply form is idempotent):
#
#   kubectl create secret generic hive-api \
#       --from-literal=HIVE_API_TOKEN="$(openssl rand -hex 32)" \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# The manifest below exists so the directory parses and documents the shape,
# but it is NOT a working deployment: deployment.yaml sets
# HIVE_PRODUCTION=true and the server refuses to start on this placeholder.
# Do NOT `kubectl apply` it over a real secret — it would overwrite the live
# token with REPLACE-ME. Either create the secret out-of-band (above) and
# apply only configmap.yaml + deployment.yaml, or replace the value locally
# (never commit it) and apply all three files explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: hive-api
type: Opaque
stringData:
  HIVE_API_TOKEN: "REPLACE-ME"
