# Bearer token for the Hive API server (scripts/hive_api_server.py).
# When HIVE_API_TOKEN is set, /route, /compress, /remember and /recall
# require `Authorization: Bearer <token>`; /health and /ready stay public.
#
# Prefer creating this out-of-band instead of committing a value:
#
#   kubectl create secret generic hive-api \
#       --from-literal=HIVE_API_TOKEN="$(openssl rand -hex 32)"
#
# The manifest below exists so `kubectl apply -f deploy/k8s/` works; replace
# the placeholder before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: hive-api
type: Opaque
stringData:
  HIVE_API_TOKEN: "REPLACE-ME"
