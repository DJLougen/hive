apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  labels:
    app: hive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hive
  template:
    metadata:
      labels:
        app: hive
    spec:
      containers:
        - name: hive
          # No published image ships the API server today. Build one from
          # this repo, e.g.:
          #   docker build -f docker/Dockerfile.aarch64 -t hive:aarch64 .
          # (that Dockerfile installs fastapi/uvicorn and defaults to the
          # command below), or any image with `pip install .[server]`.
          image: ghcr.io/djlougen/hive:latest
          # scripts/hive_api_server.py serves /health, /ready, /route,
          # /compress, /remember, /recall on this port.
          command: ["python3", "scripts/hive_api_server.py"]
          args: ["--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HIVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-api
                  key: HIVE_API_TOKEN
            - name: HIVE_HEALTH_BIND
              value: "0.0.0.0"
            - name: HIVE_RATE_LIMIT
              value: "1000"
            - name: HIVE_TENANT_ISOLATION
              value: "true"
            - name: HIVE_VALIDATE_INPUTS
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hive
spec:
  selector:
    app: hive
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
