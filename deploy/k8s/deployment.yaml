apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  labels:
    app: hive
spec:
  # Single replica: memory is per-pod local state (see deploy/README.md).
  # More than one replica silently diverges — do not scale this.
  replicas: 1
  # Recreate: two overlapping pods would serve divergent local memory and
  # race on the same snapshot file. Never run old+new simultaneously.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hive
  template:
    metadata:
      labels:
        app: hive
    spec:
      containers:
        - name: hive
          # No published image ships the API server today — replace this with
          # an image you built. docker/Dockerfile.aarch64 builds one, but its
          # build context is the PARENT directory of this checkout (it COPYs
          # the sibling busyBee-cpu/ and honey-comb/ trees):
          #   cd .. && docker build -f hive/docker/Dockerfile.aarch64 -t hive:aarch64 .
          # then reference hive:aarch64 here (locally) or push to your
          # registry. Any custom image must contain this source tree —
          # `pip install .[server]` alone does NOT install
          # scripts/hive_api_server.py (it is not a packaged module).
          image: ghcr.io/djlougen/hive:latest
          # scripts/hive_api_server.py serves /health, /ready, /route,
          # /compress, /remember, /recall on this port.
          command: ["python3", "scripts/hive_api_server.py"]
          args: ["--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          # HiveConfig fields (rate limit, tenant isolation, TTL, max nodes)
          # come from the hive-config ConfigMap — edit configmap.yaml, not
          # here. Server-specific vars stay inline below; the token comes
          # from the hive-api Secret.
          envFrom:
            - configMapRef:
                name: hive-config
          env:
            - name: HIVE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hive-api
                  key: HIVE_API_TOKEN
            # Server-specific env (scripts/hive_api_server.py):
            # off = no routing policy loaded, /route escalates everything;
            # rule = local rule-based policy. No paid/unsafe implicit loads.
            - name: HIVE_ROUTING_POLICY
              value: "off"
            # Production gate: the server refuses to start if HIVE_API_TOKEN
            # is missing or a placeholder (see secret.yaml — replace it).
            - name: HIVE_PRODUCTION
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hive
spec:
  selector:
    app: hive
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
