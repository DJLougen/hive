apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  labels:
    app: hive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hive
  template:
    metadata:
      labels:
        app: hive
    spec:
      containers:
        - name: hive
          image: ghcr.io/djlougen/hive:latest
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: HIVE_HEALTH_BIND
              value: "0.0.0.0"
            - name: HIVE_RATE_LIMIT
              value: "1000"
            - name: HIVE_TENANT_ISOLATION
              value: "true"
            - name: HIVE_VALIDATE_INPUTS
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: hive
spec:
  selector:
    app: hive
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  type: ClusterIP
