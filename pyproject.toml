[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-agent-memory"
version = "0.3.0"
description = "Hive: unified agent memory & context compression stack for 2026 NVIDIA + edge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hive Authors" }]
keywords = [
    "agent", "memory", "context-compression", "honeycomb",
    "busybee", "rust-brain", "hive", "llm", "jetson", "grace",
    "nvidia", "edge-ai", "cpu-offload",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Hive is a *meta-package*. Each component is developed in its own repo
# and pulled in via direct path / git / or wheel.
#
#   busyBee-cpu  : CPU-only action routing (https://github.com/DJLougen/busyBee-cpu)
#   honey-comb   : Inline context compression (https://github.com/DJLougen/honey-comb)
#   rust_brain   : Timestamped graph memory (bundled in this repo at hive/rust_brain/)
#   rule_fast    : In-repo rule-based compressor fallback (no honey-comb needed)
#
# For local development we install siblings via `pip install -e ../busyBee-cpu ../honey-comb`.
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    # Component deps are pulled in via the local editable installs above.
    # When installing from PyPI/Git releases they are pulled transitively.
]

[project.optional-dependencies]
# GPU / inference (used by examples + integration, not required for the core stack)
gpu = [
    "torch>=2.1",
    "transformers>=4.40",
]
vllm = ["vllm>=0.5"]
# Hardware monitoring. pynvml works on NVIDIA + nvidia-ml-py on Jetson.
monitor = ["pynvml>=2.0"]
# Native Rust backend for performance-critical workloads (optional)
performance = ["hive-cpp>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/DJLougen/hive"
busyBee = "https://github.com/DJLougen/busyBee-cpu"
honeyComb = "https://github.com/DJLougen/honey-comb"

[tool.setuptools]
packages = ["hive", "hive.rust_brain", "hive.rule_fast"]
include-package-data = true

[tool.setuptools.package-data]
"hive" = ["py.typed"]
"hive.rust_brain" = ["py.typed"]
"hive.rule_fast" = ["py.typed"]
