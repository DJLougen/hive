[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-agent-memory"
version = "0.6.1"
description = "Hive: unified agent memory & context compression stack for 2026 NVIDIA + edge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hive Authors" }]
keywords = [
    "agent", "memory", "context-compression", "honeycomb",
    "busybee", "rust-brain", "hive", "llm", "jetson", "grace",
    "nvidia", "edge-ai", "cpu-offload",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Hive is a *meta-package*. Each component is developed in its own repo
# and pulled in via direct path / git / or wheel.
#
#   busyBee-cpu  : CPU-only action routing (https://github.com/DJLougen/busyBee-cpu)
#   honey-comb   : Inline context compression (https://github.com/DJLougen/honey-comb)
#   rust_brain   : Timestamped graph memory (bundled in this repo at hive/rust_brain/)
#   rule_fast    : In-repo rule-based compressor fallback (no honey-comb needed)
#
# For local development install siblings via `pip install -e ../busyBee-cpu ../honey-comb`.
# From PyPI use `pip install "hive-agent-memory[full]"` once siblings are published.
dependencies = [
    "joblib>=1.4",
    "pydantic>=2.10",
    "cryptography>=43.0",
    "PyJWT>=2.10",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Full stack: trained CPU router + ML compressor (siblings on PyPI when published).
# Until published, install siblings from git or local paths — see README.
full = [
    "busybee-cpu @ git+https://github.com/DJLougen/busyBee-cpu.git",
    "honey-comb @ git+https://github.com/DJLougen/honey-comb.git",
]
# GPU / inference (used by examples + integration, not required for the core stack)
gpu = [
    "torch>=2.5",
    "transformers>=4.46",
]
vllm = ["vllm>=0.6"]
# Hardware monitoring. pynvml works on NVIDIA + nvidia-ml-py on Jetson.
monitor = ["pynvml>=12.0"]
# Native Rust backend for performance-critical workloads (optional, built from hive-cpp/)
performance = ["hive-cpp"]
# Real-time observability: Prometheus, OpenTelemetry, JSONL export
observability = [
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8,<0.17",
    "mypy>=1.13",
    "build>=1.2",
    "twine>=5.1",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
mcp = ["mcp>=1.0"]
agents = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "mcp>=1.0"]
http = ["httpx>=0.28"]

[project.scripts]
hive-mcp = "hive.mcp_server:main"
hive-mcp-install = "hive.mcp_install:main"

[tool.uv.sources]
hive-cpp = { path = "hive-cpp", editable = true }

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8,<0.17",
    "mypy>=1.13",
    "build>=1.2",
    "twine>=5.1",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "B017", "RUF002", "RUF003", "RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/fixtures/*" = ["E501", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["hive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Homepage = "https://github.com/DJLougen/hive"
busyBee = "https://github.com/DJLougen/busyBee-cpu"
honeyComb = "https://github.com/DJLougen/honey-comb"

[tool.setuptools]
packages = ["hive", "hive.mcp", "hive.rust_brain", "hive.rule_fast"]
include-package-data = true

[tool.setuptools.package-data]
"hive" = ["py.typed"]
"hive.rust_brain" = ["py.typed"]
"hive.rule_fast" = ["py.typed"]
