name: hive-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # x86_64 + CPU only. The cheapest matrix entry; runs everywhere.
  cpu:
    name: x86_64 / Python ${{ matrix.python }} / CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Sibling packages are not under test here; we only need the
          # rule_fast + rust_brain paths. ``hive-comb`` is included so
          # the honey-comb code path is exercised in CI too.
          pip install -e ../busyBee-cpu -e ../honey-comb -e .[dev,monitor,observability]
      - name: Test
        env:
          HIVE_NO_NVML: "1"
        run: pytest -v
      - name: Benchmark (smoke)
        env:
          HIVE_NO_NVML: "1"
        run: |
          python scripts/hive_benchmark.py \
              --transcript-turns 50 --brain-writes 500 \
              --honey-comb-mode auto --inference-backend echo \
              --quiet

  # x86_64 + CUDA. The main dev target.
  gpu:
    name: x86_64 / Python 3.12 / CUDA
    runs-on: [self-hosted, gpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ../busyBee-cpu -e ../honey-comb -e .[dev,monitor,observability]
      - name: Test
        run: pytest -v
      - name: Benchmark
        run: |
          python scripts/hive_benchmark.py \
              --transcript-turns 200 --brain-writes 5000 \
              --honey-comb-mode auto --inference-backend echo \
              --runs 3 --output bench-gpu.json --quiet
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-gpu
          path: bench-gpu.json

  # aarch64 + CUDA. Jetson / Grace. Self-hosted because GH does not
  # provide arm64 GPU runners.
  jetson:
    name: aarch64 / Python 3.12 / Jetson
    runs-on: [self-hosted, jetson]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://pypi.nvidia.com -e .[dev,monitor,observability]
      - name: Test
        env:
          # Real NVML on Jetson works via nvidia-ml-py; pynvml is a shim.
          HIVE_NO_NVML: "0"
        run: pytest -v
      - name: Benchmark
        run: |
          python scripts/hive_benchmark.py \
              --transcript-turns 100 --brain-writes 1000 \
              --honey-comb-mode fast --inference-backend echo \
              --output bench-jetson.json --quiet
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-jetson
          path: bench-jetson.json

  # Build Rust wheels for major platforms.
  # Only runs on tags or manual dispatch to avoid burning minutes on every PR.
  rust-wheels:
    name: Build hive-cpp wheels
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cibw_arch: x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cibw_arch: aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            cibw_arch: x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            cibw_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cibw_arch: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: hive-cpp
        run: |
          maturin build --release --target ${{ matrix.target }} --out ../dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: hive-cpp-wheels-${{ matrix.target }}
          path: dist/*.whl
