name: hive-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly GPU smoke (self-hosted runner when available)
    - cron: "0 6 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # x86_64 + CPU only. Runs everywhere, no external deps.
  cpu:
    name: x86_64 / Python ${{ matrix.python }} / CPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lockfile check
        run: |
          pip install uv
          uv lock --check
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,monitor,observability,server,mcp,http]
      - name: Test
        env:
          HIVE_NO_NVML: "1"
        # Coverage floor is enforced only on 3.12, the interpreter it was
        # measured on: 80.8% (2328/2880 statements), rounded down to the nearest
        # multiple of 5. On any other interpreter coverage is still collected and
        # reported but must not fail the build on a number nobody measured
        # there. Raise the floor only after re-measuring; the next step up is 85%.
        run: |
          if [ "${{ matrix.python }}" = "3.12" ]; then
            pytest -v --cov=hive --cov-report=term-missing --cov-fail-under=80
          else
            pytest -v --cov=hive --cov-report=term-missing
          fi
      - name: Benchmark (smoke)
        env:
          HIVE_NO_NVML: "1"
        run: |
          python scripts/hive_benchmark.py \
              --transcript-turns 50 --brain-writes 500 \
              --honey-comb-mode auto --inference-backend echo \
              --quiet
      - name: Long-context compression (smoke)
        env:
          HIVE_NO_NVML: "1"
        run: python scripts/hive_long_context_eval.py --smoke
      - name: Claim check
        run: python scripts/check_claims.py
      - name: Bench task oracles (no LLM, no cost)
        run: python scripts/hive_bench.py --verify-tasks
      - name: Lint
        run: |
          python -m ruff check hive/ tests/
          python -m mypy hive/ --ignore-missing-imports
      - name: Validate CITATION.cff
        run: |
          if [ ! -f .github/citation.cff ]; then
            echo "Error: .github/citation.cff not found"
            exit 1
          fi
          pip install cffconvert
          cffconvert --validate -i .github/citation.cff
      - name: Security scan (hive only)
        run: |
          pip install bandit
          python -m bandit -r hive/ -ll -q
          python scripts/hive_pentest.py --module hive
      - name: Supply chain audit
        run: |
          pip install --upgrade 'setuptools>=83'
          pip-audit --skip-editable

  # hive-cpp crate + the Python native backend path. This is the job that would
  # have caught the original wrong-arity bindings: it builds the extension and
  # runs the adapter tests with HIVE_REQUIRE_NATIVE=1 (no skipping).
  rust:
    name: hive-cpp / native backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Crate unit tests
        working-directory: hive-cpp
        run: cargo test
      - name: Build and install the extension
        working-directory: hive-cpp
        run: |
          pip install maturin
          maturin build --release --out ../dist
          pip install ../dist/*.whl
      - name: Native backend tests (required)
        env:
          HIVE_REQUIRE_NATIVE: "1"
          HIVE_NO_NVML: "1"
        run: |
          pip install -e ".[dev,monitor,observability,server,mcp,http]"
          pytest tests/test_native_backend.py -v
      - name: Default backend does not switch itself to native
        env:
          HIVE_NO_NVML: "1"
        # The regression this guards: with the crate importable, `auto` used to
        # resolve to native, silently handing compress() to a lossy compressor.
        # Native must stay opt-in.
        run: |
          python - <<'PY'
          import importlib.util
          from hive.backend import resolve_backend

          assert importlib.util.find_spec("hive_cpp") is not None, "crate is not installed"
          assert resolve_backend() == "python", "auto must not select native by itself"
          assert resolve_backend("native") == "native", "explicit native must still work"
          print("default backend:", resolve_backend())
          PY
      - name: Full suite with the crate installed
        env:
          HIVE_NO_NVML: "1"
        # The one job where hive_cpp is importable: run everything here, so the
        # native path cannot diverge from the Python path unobserved.
        run: pytest -q

  # MCP server import smoke
  mcp-smoke:
    name: MCP / server smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agents extra
        run: pip install -e ".[dev,agents]"
      - name: MCP integration tests
        run: pytest tests/test_mcp_smoke.py tests/test_mcp_integration.py -v

  # SBOM generation on main
  sbom:
    name: SBOM
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # Full-stack pentest: hive + busybee-cpu + honey-comb
  pentest:
    name: Pentest / full stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone sibling packages
        run: |
          git clone --depth 1 https://github.com/DJLougen/busyBee-cpu.git /tmp/busyBee-cpu
          git clone --depth 1 https://github.com/DJLougen/honey-comb.git /tmp/honey-comb
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e /tmp/busyBee-cpu /tmp/honey-comb -e ".[dev]"
      - name: Modular pentest
        env:
          HIVE_NO_NVML: "1"
        run: |
          python scripts/hive_pentest.py --fail-on-skip
      # This is the only job with the sibling packages installed, so it is the
      # only place the honey-comb / busybee code paths are exercised rather than
      # skipped. Without this step those tests skip in every job that runs pytest.
      - name: Sibling-dependent tests (no longer skipped)
        env:
          HIVE_NO_NVML: "1"
        run: pytest -q tests/test_stack.py tests/test_benchmark_cli.py -rs

  # x86_64 + CUDA. Requires self-hosted runner with GPU label.
  gpu:
    name: x86_64 / Python 3.12 / CUDA (nightly smoke)
    # Requires a registered [self-hosted, gpu, cuda] runner. With none
    # registered the job is unschedulable and would sit queued forever,
    # leaving every push-to-main run permanently "queued" (never a CI
    # result at all). Gate it on a repo variable so it is skipped until a
    # runner exists: set ENABLE_SELF_HOSTED_CI=true to turn it on.
    if: vars.ENABLE_SELF_HOSTED_CI == 'true' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, gpu, cuda]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,monitor,observability]
      - name: Test
        run: pytest -v --ignore=tests/test_integration_llm.py
      - name: Benchmark
        run: |
          python scripts/hive_benchmark.py \
              --transcript-turns 50 --brain-writes 500 \
              --honey-comb-mode auto --inference-backend echo \
              --quiet

  # aarch64 + CUDA. Jetson / Grace.
  jetson:
    name: aarch64 / Python 3.12 / Jetson (nightly smoke)
    # Same guard as gpu: no [self-hosted, jetson] runner is registered.
    if: vars.ENABLE_SELF_HOSTED_CI == 'true' && github.event_name == 'schedule'
    runs-on: [self-hosted, jetson]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://pypi.nvidia.com -e .[dev,monitor,observability]
      - name: Test
        env:
          HIVE_NO_NVML: "0"
        run: pytest -v --ignore=tests/test_integration_llm.py
      - name: Benchmark
        run: |
          python scripts/hive_benchmark.py \
              --transcript-turns 50 --brain-writes 500 \
              --honey-comb-mode fast --inference-backend echo \
              --quiet

  # Build Rust wheels for major platforms.
  rust-wheels:
    name: Build hive-cpp wheels
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: hive-cpp
        run: |
          maturin build --release --target ${{ matrix.target }} --out ../dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: hive-cpp-wheels-${{ matrix.target }}
          path: dist/*.whl
