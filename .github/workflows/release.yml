name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheels
        run: python -m build --wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Gate: the exact artifacts about to be published must install and import
  # before anything reaches PyPI. publish-pypi needs this job, so a broken
  # wheel blocks the release instead of shipping.
  validate-release:
    name: Validate built artifacts
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify the locally built wheel installs and imports
        # Install the exact wheel file built in this workflow — NOT a
        # `pip install <package>` resolver lookup pointed at dist/, which
        # can fall back to whatever PyPI already has and validate a stale
        # published package instead of this build.
        run: |
          python -m pip install dist/hive_agent_memory-*.whl
          python - <<'PY'
          import os
          import hive, hive.rust_brain
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert hive.__version__ == tag, f"wheel {hive.__version__} != tag {tag}"
          print("installed wheel version:", hive.__version__)
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-release:
    name: Create GitHub Release
    # The GitHub release advertises the artifacts — it must not exist for a
    # version that never reached PyPI.
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes
        id: extract-notes
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          python scripts/extract_release_notes.py "$TAG_VERSION"
          echo "release_name=$(cat release_name.txt)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.extract-notes.outputs.release_name }}
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
          make_latest: true
