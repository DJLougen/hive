name: bug
description: Report a bug in Hive.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please
        include enough information that a maintainer can reproduce the
        issue without guessing.
  - type: input
    id: hive_version
    attributes:
      label: Hive version
      description: Output of `python -c "import hive; print(hive.__version__)"`
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Output of `python --version`
      placeholder: "3.12.3"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Output of `uname -a` (or Windows version)
      placeholder: "Linux 6.5.0 x86_64"
    validations:
      required: true
  - type: textarea
    id: siblings
    attributes:
      label: Sibling package versions
      description: Output of `pip show busybee-cpu honeycomb | grep -E '^(Name|Version)'`
      placeholder: |
        Name: busybee-cpu
        Version: 0.7.0
        Name: honeycomb
        Version: 0.2.1
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal command or script that triggers the bug.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to see.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any output, including tracebacks, that the bug produced.
      render: shell
