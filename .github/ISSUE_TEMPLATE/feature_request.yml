name: feature_request
description: Propose a new feature or a change to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose a new feature. If you are also
        volunteering to implement it, say so — we are happy to review
        PRs that come with a problem statement.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? If you have a
        real-world scenario, describe it here.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A high-level description of the API or the change you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why is the
        proposed one better?
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected by this change? (busyBee, honey-comb,
        rust-brain, the integration example, the CI matrix, the docs?)
  - type: checkbox
    id: willing
    attributes:
      label: I am willing to submit a PR for this.
      options:
        - label: Yes
        - label: No
