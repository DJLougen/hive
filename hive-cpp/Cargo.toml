[package]
name = "hive-cpp"
version = "0.1.0"
edition = "2021"
description = "Native Rust backend for Hive"

[lib]
name = "hive_cpp"
crate-type = ["cdylib"]

[features]
default = []
pyo3 = ["dep:pyo3"]

[dependencies]
rayon = "1.8"
dashmap = "5.5"
parking_lot = "0.12"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

simd-json = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand = "0.8"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
