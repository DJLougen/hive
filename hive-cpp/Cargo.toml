[package]
name = "hive-cpp"
version = "0.7.0"
edition = "2021"
description = "Native Rust backend for Hive"

[lib]
name = "hive_cpp"
crate-type = ["cdylib", "rlib"]

[features]
default = []
pyo3 = ["dep:pyo3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python bindings
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"


[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
